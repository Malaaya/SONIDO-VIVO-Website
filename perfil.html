<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil | SONIDO VIVO</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23d00000'/><text x='32' y='36' font-family='Arial, sans-serif' font-style='italic' font-weight='bold' font-size='38' fill='%23ffffff' text-anchor='middle' dominant-baseline='central' letter-spacing='-4'>sv</text></svg>">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .profile-container {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem;
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 2rem;
    }

    .profile-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 1.5rem;
      height: fit-content;
    }

    .profile-card h2 {
      margin-bottom: 1rem;
      font-size: 1.3rem;
      color: var(--bg-dark);
      border-bottom: 2px solid var(--accent-yellow);
      padding-bottom: 0.5rem;
    }

    .info-group {
      margin-bottom: 0.8rem;
    }

    .info-group label {
      display: block;
      font-size: 0.8rem;
      color: #64748b;
      font-weight: 600;
    }

    .info-group span {
      font-size: 1rem;
      color: #0f172a;
      font-weight: 600;
    }

    .btn-logout {
      width: 100%;
      margin-top: 1.5rem;
      padding: 0.6rem;
      background-color: #ef4444;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-logout:hover {
      background-color: #dc2626;
    }

    .order-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 1.2rem;
      margin-bottom: 1rem;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 0.5rem;
      margin-bottom: 0.8rem;
    }

    .order-id {
      font-weight: bold;
      color: var(--bg-dark);
    }

    .order-date {
      font-size: 0.85rem;
      color: #64748b;
    }

    .order-items {
      list-style: none;
      padding: 0;
      margin: 0 0 0.8rem 0;
    }

    .order-items li {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      padding: 0.3rem 0;
    }

    .order-total {
      text-align: right;
      font-weight: 800;
      font-size: 1.1rem;
      color: #0f172a;
      border-top: 1px dashed #e2e8f0;
      padding-top: 0.5rem;
    }

    @media (max-width: 768px) {
      .profile-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Encabezado -->
  <header class="site-header">
    <div class="top-bar" style="display: flex; align-items: center; justify-content: space-between; position: relative;">
      
      <div class="brand-logo">
        <a href="index.html">SONIDO <span>VIVO</span></a>
      </div>

      <div class="user-center" style="position: absolute; left: 50%; transform: translateX(-50%);">
        <a href="perfil.html" class="btn-auth-pill">Mi Perfil</a>
      </div>

      <div class="user-actions">
        <a href="productos.html" class="btn-catalog-link">← Volver al Catálogo</a>
      </div>

    </div>
  </header>

  <!-- Contenido del Perfil -->
  <main class="profile-container">

    <!-- Tarjeta de Datos del Usuario -->
    <section class="profile-card">
      <h2>Mi Información</h2>
      
      <div class="info-group">
        <label>Nombre Completo</label>
        <span id="user-nombre">Cargando...</span>
      </div>

      <div class="info-group">
        <label>RUN / Identificación</label>
        <span id="user-run">Cargando...</span>
      </div>

      <div class="info-group">
        <label>Correo Electrónico</label>
        <span id="user-email">Cargando...</span>
      </div>

      <div class="info-group">
        <label>Teléfono</label>
        <span id="user-telefono">Cargando...</span>
      </div>

      <button id="btn-cerrar-sesion" class="btn-logout">Cerrar Sesión</button>
    </section>

    <!-- Historial de Compras -->
    <section class="profile-card">
      <h2>Historial de Compras</h2>
      <div id="contenedor-historial">
        <!-- Las compras realizadas se cargarán dinámicamente -->
      </div>
    </section>

  </main>

  <script src="js/login.js"></script>
  <script src="js/perfil.js"></script>
</body>
</html>
